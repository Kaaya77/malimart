<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- FIX #1: Removed maximum-scale=1.0 and user-scalable=no (WCAG 1.4.4 violation).
         viewport-fit=cover retained for notch/island support. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MaliMart - Tanzanian Marketplace</title>
    <meta name="description" content="Discover authentic Tanzanian products from verified local sellers. Shop fashion, crafts, spices, and more on MaliMart." />

    <!-- PWA & Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a08" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaliMart" />

    <!-- Open Graph / Facebook -->
    <meta property="og:locale" content="sw_TZ" />
    <link rel="canonical" href="https://malimart.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://malimart.vercel.app/" />
    <meta property="og:title" content="MaliMart - Tanzanian Heritage Marketplace" />
    <meta property="og:description" content="Connect with Tanzania's finest artisans and merchants. Secure payments, nationwide delivery." />
    <meta property="og:image" content="https://malimart.vercel.app/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://malimart.vercel.app/" />
    <meta property="twitter:title" content="MaliMart - Tanzanian Marketplace" />
    <meta property="twitter:description" content="Discover authentic Tanzanian products from verified local sellers." />
    <meta property="twitter:image" content="https://malimart.vercel.app/api/og" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f43f5e%22/><text y=%22.9em%22 font-size=%2270%22 x=%2215%22>🛍️</text></svg>">

    <script>
      (function() {
        const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Rose is MaliMart's official brand accent (see services/theme.ts —
        // ACCENT_PRESETS[0], hue 345 sat 74%, same RAMP function). Signed-in
        // users get their saved theme_accent from AppContext's applyTheme()
        // once the session resolves, which overrides these same CSS vars —
        // but a signed-out visitor never reaches that code at all, so
        // without this the whole app rendered literal Tailwind emerald
        // (green) for every guest. This is the same values, computed once,
        // applied before first paint so there's no color flash either.
        var rose = {
          50: 'hsl(345 74% 97%)', 100: 'hsl(345 74% 93%)', 200: 'hsl(345 74% 86%)',
          300: 'hsl(345 74% 76%)', 400: 'hsl(345 74% 64%)', 500: 'hsl(345 74% 52%)',
          600: 'hsl(345 74% 44%)', 700: 'hsl(345 74% 36%)', 800: 'hsl(345 74% 29%)',
          900: 'hsl(345 74% 23%)', 950: 'hsl(345 74% 15%)',
        };
        for (var step in rose) {
          document.documentElement.style.setProperty('--color-emerald-' + step, rose[step]);
        }
      })();
    </script>
    <!-- Resource hints -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-blur: 20px;
      }

      .dark {
        --glass-bg: rgba(2, 6, 23, 0.8);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
        letter-spacing: -0.03em;
      }

      /* Subtle Texture */
      .bg-noise {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        pointer-events: none;
      }

      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
      }

      /* Slim, subtle scrollbar — keeps scroll affordance without a heavy gutter.
         (Intentional horizontal rails opt out via the .no-scrollbar class.) */
      ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(120, 113, 108, 0.35);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(120, 113, 108, 0.55); background-clip: content-box; }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Safe area handled per-component to avoid double-padding on notched devices */
    </style>

  <!-- Preconnect to the Supabase project host — warms DNS+TLS+TCP before the
       first auth/data call. crossorigin required for CORS fetch connection reuse. -->
  <link rel="preconnect" href="https://ubpapxdmqlepynonhaeo.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ubpapxdmqlepynonhaeo.supabase.co">
</head>
  <body class="bg-background text-foreground transition-colors duration-500 overflow-x-hidden antialiased">
    <div class="bg-noise"></div>
    <div id="root" class="relative z-10"></div>
    <script>
      const handleReveal = () => {
        const reveals = document.querySelectorAll('.reveal');
        reveals.forEach(el => {
          const windowHeight = window.innerHeight;
          const revealTop = el.getBoundingClientRect().top;
          const revealPoint = 50;
          if (revealTop < windowHeight - revealPoint) {
            el.classList.add('active');
          }
        });
      };
      window.addEventListener('scroll', handleReveal);
      window.addEventListener('load', handleReveal);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
