name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Anonymous API surface audit
        # Fails if the public (unauthenticated) read surface drifts from
        # scripts/anon-surface.expected.json. Read-only, and needs no secrets:
        # the anon key is public by design. Regression test for the
        # 2026-09-02 view-grant escalation.
        run: node scripts/anon-surface-audit.mjs

      - name: Production build
        run: npx vite build
        env:
          # Build-time fallbacks are baked into vite.config.ts;
          # real values are injected by Vercel at deploy time.
          CI: true
